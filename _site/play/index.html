<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play TapMe.plus</title>
  <meta name="description" content="Launch the TapMe.plus web game.">
  <link rel="canonical" href="https://www.tapme.plus/play/">
  <link rel="stylesheet" href="/assets/css/tapme.css">
</head>
<body>
  <main class="tapme-section">
    <h1>Play TapMe.plus</h1>
    <p>The fastest way to play is the full-screen web build.</p>
    <p><a class="tapme-button tapme-button--primary" href="https://web.tapme.plus">Play at web.tapme.plus</a></p>
    <p>The web build downloads the Godot runtime and game package on first launch. Later visits are usually cached by your browser.</p>
    <div class="tapme-game-frame">
      <iframe src="https://web.tapme.plus" title="TapMe.plus web game" loading="lazy" allow="fullscreen"></iframe>
    </div>
    <p><a href="/">Back to homepage</a></p>
  </main>
</body>
</html>
